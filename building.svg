<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" width="560" height="760" role="img" aria-label="בניין מגורים חדש">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222a5e"/>
      <stop offset="0.45" stop-color="#161a2e"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#636EFA" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#636EFA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#636EFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#272b39"/>
      <stop offset="0.5" stop-color="#1e212b"/>
      <stop offset="1" stop-color="#141620"/>
    </linearGradient>
    <linearGradient id="towerBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1f29"/>
      <stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a8a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a2138" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b24"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <pattern id="windows" x="0" y="0" width="34" height="40" patternUnits="userSpaceOnUse">
      <rect width="34" height="40" fill="none"/>
      <rect x="5" y="6" width="24" height="28" rx="2" fill="#0c0e15" opacity="0.85"/>
    </pattern>
  </defs>

  <!-- sky + glow -->
  <rect width="560" height="760" fill="url(#sky)"/>
  <rect width="560" height="760" fill="url(#glow)"/>
  <circle cx="430" cy="92" r="34" fill="#f5f3e7" opacity="0.9"/>
  <circle cx="430" cy="92" r="60" fill="#f5b54a" opacity="0.10"/>

  <!-- back tower (right, for depth) -->
  <g>
    <rect x="372" y="232" width="150" height="500" rx="6" fill="url(#towerBack)" stroke="#2d2f36" stroke-width="1"/>
    <rect x="372" y="232" width="150" height="500" rx="6" fill="url(#windows)" opacity="0.7"/>
    <rect x="402" y="288" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.75"/>
    <rect x="470" y="356" width="24" height="28" rx="2" fill="#8b94ff" opacity="0.7"/>
    <rect x="402" y="492" width="24" height="28" rx="2" fill="#00CC96" opacity="0.55"/>
    <rect x="436" y="560" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.65"/>
  </g>

  <!-- main tower -->
  <g>
    <rect x="118" y="150" width="276" height="582" rx="10" fill="url(#towerMain)" stroke="#3a3d49" stroke-width="1.5"/>
    <!-- glass accent stripe -->
    <rect x="250" y="150" width="60" height="582" fill="url(#glass)" opacity="0.45"/>
    <!-- roof crown + antenna -->
    <rect x="150" y="132" width="212" height="22" rx="6" fill="#20232f" stroke="#3a3d49" stroke-width="1"/>
    <rect x="250" y="92" width="6" height="42" rx="3" fill="#3a3d49"/>
    <circle cx="253" cy="90" r="5" fill="#00CC96"/>
    <!-- window grid -->
    <rect x="134" y="170" width="244" height="544" fill="url(#windows)"/>
    <!-- lit windows (warm/brand colors) -->
    <g>
      <rect x="173" y="206" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.9"/>
      <rect x="275" y="206" width="24" height="28" rx="2" fill="#8b94ff" opacity="0.85"/>
      <rect x="139" y="286" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.8"/>
      <rect x="241" y="286" width="24" height="28" rx="2" fill="#00CC96" opacity="0.7"/>
      <rect x="343" y="286" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.85"/>
      <rect x="207" y="366" width="24" height="28" rx="2" fill="#8b94ff" opacity="0.8"/>
      <rect x="309" y="366" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.75"/>
      <rect x="139" y="446" width="24" height="28" rx="2" fill="#00CC96" opacity="0.6"/>
      <rect x="275" y="446" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.9"/>
      <rect x="173" y="526" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.7"/>
      <rect x="343" y="526" width="24" height="28" rx="2" fill="#8b94ff" opacity="0.75"/>
      <rect x="241" y="606" width="24" height="28" rx="2" fill="#f5b54a" opacity="0.85"/>
      <rect x="139" y="606" width="24" height="28" rx="2" fill="#00CC96" opacity="0.6"/>
    </g>
    <!-- balcony lines -->
    <g stroke="#454956" stroke-width="2" opacity="0.6">
      <line x1="134" y1="262" x2="378" y2="262"/>
      <line x1="134" y1="342" x2="378" y2="342"/>
      <line x1="134" y1="422" x2="378" y2="422"/>
      <line x1="134" y1="502" x2="378" y2="502"/>
      <line x1="134" y1="582" x2="378" y2="582"/>
      <line x1="134" y1="662" x2="378" y2="662"/>
    </g>
    <!-- ground floor entrance -->
    <rect x="222" y="688" width="68" height="44" rx="4" fill="#0c0e15"/>
    <rect x="240" y="700" width="32" height="32" fill="#8b94ff" opacity="0.35"/>
  </g>

  <!-- ground + greenery -->
  <rect x="0" y="726" width="560" height="34" fill="url(#ground)"/>
  <g>
    <rect x="70" y="690" width="8" height="40" fill="#3a2f24"/>
    <circle cx="74" cy="684" r="26" fill="#00CC96" opacity="0.55"/>
    <rect x="486" y="694" width="7" height="36" fill="#3a2f24"/>
    <circle cx="489" cy="690" r="22" fill="#00CC96" opacity="0.5"/>
  </g>
</svg>
